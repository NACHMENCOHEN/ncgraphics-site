<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:"FRL";font-weight:500;src:url(node_modules/@fontsource/frank-ruhl-libre/files/frank-ruhl-libre-hebrew-500-normal.woff2)}
@font-face{font-family:"FRL";font-weight:900;src:url(node_modules/@fontsource/frank-ruhl-libre/files/frank-ruhl-libre-hebrew-900-normal.woff2)}
@font-face{font-family:"Heebo";font-weight:400;src:url(node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2)}
@font-face{font-family:"Heebo";font-weight:700;src:url(node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2)}
@font-face{font-family:"Heebo";font-weight:800;src:url(node_modules/@fontsource/heebo/files/heebo-hebrew-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#071a21}
body{font-family:"Heebo","Inter Display",sans-serif;color:#e9eef0;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 28%,rgba(255,176,74,.22),transparent 60%),radial-gradient(1200px 900px at 50% 110%,rgba(20,128,138,.35),transparent 65%),linear-gradient(180deg,#0b2730,#061419)}
#stars{position:absolute;inset:0}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff}
.logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center}
.logo img{width:340px}
.title{position:absolute;top:220px;left:0;right:0;text-align:center}
.title h1{font-family:"FRL";font-weight:900;font-size:190px;line-height:1;background:linear-gradient(180deg,#fff6df,#f3c36b 55%,#d8963a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 40px rgba(255,170,70,.35))}
.title p{font-family:"FRL";font-weight:500;font-size:54px;color:#f7e6c4;margin-top:18px}
.title p span{color:#2BB3B8}
#candles{position:absolute;top:600px;left:0;right:0;height:300px}
.cand{position:absolute;bottom:0;width:62px;height:190px;border-radius:10px 10px 6px 6px;background:linear-gradient(90deg,#e9e2d3,#fffaf0 45%,#d9d0bd)}
.cand::after{content:"";position:absolute;top:-16px;left:29px;width:4px;height:18px;background:#2a2622;border-radius:2px}
.flame{position:absolute;width:46px;height:96px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 75%,#fff 0 18%,#ffe7a3 32%,#ffb347 55%,rgba(255,120,30,0) 72%);filter:blur(1px)}
.halo{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.38),rgba(255,160,60,0) 65%)}
.holder{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);width:420px;height:44px;border-radius:22px;background:linear-gradient(180deg,#e6c27a,#9c7631);box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.table{position:absolute;top:990px;left:70px;right:70px;border-radius:34px;background:rgba(10,36,44,.78);border:2px solid rgba(43,179,184,.35);box-shadow:0 40px 90px -30px rgba(0,0,0,.8);padding:22px 34px 18px}
.row{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;align-items:center;height:86px;border-bottom:1px solid rgba(255,255,255,.08);font-size:44px}
.row:last-child{border-bottom:0}
.row.h{height:72px;font-size:30px;font-weight:700;color:#2BB3B8;letter-spacing:.02em}
.row .c{font-weight:700;color:#fff}
.row .t{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.row .t.k{color:#f3c36b}.row .t.m{color:#fff}.row .t.r{color:#9fb3b8;font-weight:700}
.row.h .t{direction:rtl;font-weight:700;color:#2BB3B8}
.note{position:absolute;top:1652px;left:0;right:0;text-align:center;font-size:24px;color:rgba(233,238,240,.5)}
.foot{position:absolute;bottom:72px;left:0;right:0;text-align:center}
.foot b{display:block;font-family:"FRL";font-weight:900;font-size:58px;color:#f7e6c4}
.foot span{display:block;margin-top:8px;font-size:30px;color:#2BB3B8;font-weight:700;direction:ltr}
</style></head><body>
<div id="bg"></div><div id="stars"></div>
<div class="logo"><img id="logo" src="nc-logo.svg" alt=""></div>
<div class="title" id="title"><h1>שבת שלום</h1><p id="sub"></p></div>
<div id="candles"><div class="halo" id="h1"></div><div class="halo" id="h2"></div><div class="holder"></div><div class="cand" id="c1"></div><div class="cand" id="c2"></div><div class="flame" id="f1"></div><div class="flame" id="f2"></div></div>
<div class="table" id="tbl"><div class="row h"><div>עיר</div><div class="t">הדלקת נרות</div><div class="t">מוצאי שבת</div><div class="t">ר״ת</div></div></div>
<div class="note" id="note">הדלקת נרות: בחו״ל 15–18 דק׳ לפני השקיעה, בירושלים 40 דק׳ · ר״ת: 72 דק׳ אחרי השקיעה</div>
<div class="foot" id="foot"><b>בברכת שבת שלום ומבורך</b><span>NC Graphics · ncgraphics.site</span></div>
<script>
const D=__DATA__;const T=__TOTAL__;
document.getElementById('sub').innerHTML='פרשת <span>'+D.parsha+'</span> · '+D.hebdate;
const tb=document.getElementById('tbl');const R=[];
D.rows.forEach(r=>{const e=document.createElement('div');e.className='row';e.innerHTML=`<div class="c">${r.city}</div><div class="t k">${r.candles}</div><div class="t m">${r.motzei}</div><div class="t r">${r.rt}</div>`;tb.appendChild(e);R.push(e);});
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const S=[];
for(let i=0;i<90;i++){const s=document.createElement('div');s.className='st';const o={el:s,x:rnd()*1080,y:rnd()*900,p:rnd()*6,sz:1+rnd()*2.5};s.style.left=o.x+'px';s.style.top=o.y+'px';s.style.width=s.style.height=o.sz+'px';document.getElementById('stars').appendChild(s);S.push(o);}
const cl=v=>v<0?0:v>1?1:v,eo=t=>1-Math.pow(1-t,3);
function rise(el,t,d,dist=60,dur=.8){const k=eo(cl((t-d)/dur));el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dist}px)`;}
const C=[document.getElementById('c1'),document.getElementById('c2')],F=[document.getElementById('f1'),document.getElementById('f2')],H=[document.getElementById('h1'),document.getElementById('h2')];
const cx=[540-110,540+110];
C.forEach((c,i)=>{c.style.left=(cx[i]-31)+'px'});
window.render=function(t){
  S.forEach(o=>{o.el.style.opacity=(.25+.5*(.5+.5*Math.sin(t*1.3+o.p)))*cl(t/1.2);});
  rise(document.getElementById('logo'),t,0,-30,.8);
  const ti=document.getElementById('title');const k=eo(cl((t-.3)/1.1));ti.style.opacity=k;ti.style.transform=`scale(${.85+.15*k})`;
  const cd=document.getElementById('candles');rise(cd,t,.6,80,1);
  F.forEach((f,i)=>{const lit=cl((t-1.4-i*.35)/.5);const fl=Math.sin(t*9+i*2)*.06+Math.sin(t*23+i)*.03;
    f.style.left=(cx[i]-23)+'px';f.style.top=(300-190-96-6)+'px';f.style.opacity=lit;
    f.style.transform=`scale(${(.4+.6*lit)*(1+fl)},${(.4+.6*lit)*(1-fl*1.3)}) rotate(${Math.sin(t*5+i)*3}deg)`;f.style.transformOrigin='50% 90%';
    H[i].style.left=(cx[i]-210)+'px';H[i].style.top=(300-190-260)+'px';H[i].style.opacity=lit*(.85+.15*Math.sin(t*7+i));});
  rise(tb,t,2.0,80,.8);
  R.forEach((r,i)=>{const kk=eo(cl((t-2.4-i*.28)/.6));r.style.opacity=kk;r.style.transform=`translateX(${(1-kk)*-120}px)`;});
  rise(document.getElementById('note'),t,4.6,20,.6);
  rise(document.getElementById('foot'),t,4.8,50,.8);
  document.body.style.opacity=cl((T-t)/.6)*cl(t/.4+.2);
};
render(0);
</script></body></html>
